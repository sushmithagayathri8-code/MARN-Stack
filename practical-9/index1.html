<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow and text shadow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border:2px solid black;
            padding:3px;
            box-shadow: 5px 15px 5px rebeccapurple;
            margin-bottom: 2px;
        }
        .text-shadow{
            text-shadow: 5px 15px 5px violet;
        }
    </style>
</head>
<body>
    <div class="box">
       I am a box.
    </div>
    <div class="box1">
        I am a box1
    </div>
    <p class="text-shadow">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quaerat vero laborum sunt praesentium, dicta beatae ducimus eligendi voluptate laudantium ad expedita at dignissimos veniam. Tempora!
    </p>
</body>
</html>
