<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box model</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        .box{
            background-color: rgb(25, 216, 82);
        }
        .box1{
            color: beige;
            padding:15px;
            margin:35px;
            border:2px solid blueviolet
            height:200px;
            box-sizing:border-box;
        }
        .box2{ 
            color: aqua;
            padding:20px;
            margin:40px:
            border:12px;
            width: 120px;
            height:23px;
        }
    </style>
</head>
<body>
    <div class="box box1">
        I am a box    
    </div>
    <div class="box box2">
       I am another box
    </div>
</body>
</html>
