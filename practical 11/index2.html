<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css media query</title>
    <style>
         body{
            background-color:blueviolet;

        }
        @media screen and  (orientation:portrait){
          body{
            border: 2px solid pink;
          }
        }
        @media only screen and (max-width:455px){
            body{
                background-color: rgb(143, 36, 36);
                color:white;

            }
    .boxes{
        flex-direction:column;
     }
    }  
        .box{
            background-color:rgb(71, 255, 95);
            height:344px;
            width:344px;
            padding:3px;
            margin:3px;
        }
        .boxes{
            display:flex;
        }
    </style>
</head>
<body>
    <div>
        hey i am learning media query in css.
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
